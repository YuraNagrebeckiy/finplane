name: Apply grouped navigation
on:
  push:
    branches: [fix/sheets-operation-ids]
    paths:
      - ui/grouped-navigation.js
      - scripts/apply_grouped_navigation.py
      - .github/workflows/apply-grouped-navigation.yml
permissions:
  contents: write
concurrency:
  group: finplane-grouped-navigation
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/sheets-operation-ids'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply guarded navigation update and syntax checks
        run: python3 scripts/apply_grouped_navigation.py
      - name: Commit index only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Group budget with debts and weekend ideas with trips"
          git push origin HEAD:refs/heads/fix/sheets-operation-ids
