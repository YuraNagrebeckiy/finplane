name: Test goal funding core and inspect integration hooks
on:
  push:
    branches: [feat/embedded-goal-gameplay]
    paths:
      - ui/goal-funding.js
      - tests/goal-funding.cjs
      - scripts/inspect_goal_hooks.py
      - .github/workflows/goal-funding-core.yml
permissions:
  contents: write
concurrency:
  group: finplane-goal-funding-core
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/feat/embedded-goal-gameplay'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check core and allocation tests
        run: |
          node --check ui/goal-funding.js
          node tests/goal-funding.cjs
      - name: Extract source hooks without changing the application
        run: python3 scripts/inspect_goal_hooks.py
      - name: Commit source inspection only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/goal-integration
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Document exact goal, purchase and funding integration hooks"
          git push origin HEAD:refs/heads/feat/embedded-goal-gameplay
