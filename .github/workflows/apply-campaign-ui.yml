name: Apply reviewed campaign UI
on:
  push:
    branches: [fix/sheets-operation-ids]
    paths:
      - ui/campaign-panel.*
      - scripts/apply_campaign_ui.py
      - .github/workflows/apply-campaign-ui.yml
permissions:
  contents: write
concurrency:
  group: finplane-reviewed-campaign-ui
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/sheets-operation-ids'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Test and apply exact UI patch
        run: |
          python3 scripts/apply_campaign_ui.py --self-test
          python3 scripts/apply_campaign_ui.py
          git diff --stat -- index.html
      - name: Commit only index.html to the reviewed branch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Refresh family campaign interface without changing financial logic"
          git push origin HEAD:refs/heads/fix/sheets-operation-ids
